name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: ~/.cache/docker
        key: ${{ runner.os }}-docker-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: Set up GCP credentials
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/gcp-key.json
        gcloud auth activate-service-account --key-file /tmp/gcp-key.json

    - name: Build and push Docker image
      run: |
        docker build -t gcr.io/light-maker-450401-b0/bookclub-backend-service-img .
        gcloud auth configure-docker
        docker push gcr.io/light-maker-450401-b0/bookclub-backend-service-img

    - name: Deploy to Google Cloud Run
      run: |
        gcloud run deploy your-backend-service \
          --image gcr.io/light-maker-450401-b0/bookclub-backend-service-img \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated
