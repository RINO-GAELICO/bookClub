name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: ~/.cache/docker
        key: ${{ runner.os }}-docker-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: Build Docker image
      run: |
        docker build -t gcr.io/light-maker-450401-b0/bookclub-backend-service-img .

    - name: Set up GCP credentials
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/gcp-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
        gcloud config set project light-maker-450401-b0
        gcloud auth configure-docker --quiet


    - name: Push Docker image to Google Container Registry
      run: |
        docker push gcr.io/light-maker-450401-b0/bookclub-backend-service-img

    - name: SSH into GCE instance and deploy Docker container
      uses: appleboy/ssh-action@v1.2.1
      with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            ENDPOINT="metadata.google.internal/computeMetadata/v1"
            ACCOUNT="default"
            TOKEN=$(curl --silent --header "Metadata-Flavor: Google" http://${ENDPOINT}/instance/service-accounts/${ACCOUNT}/token)
            ACCESS=$(echo ${TOKEN} | grep --extended-regexp --only-matching "(ya29\.[0-9a-zA-Z._-]*)")
            HOST="https://gcr.io"
            printf ${ACCESS} | docker login ${HOST} -u oauth2accesstoken --password-stdin
            docker run --env-file .env -d --name bookclub-backend-service-instance -p 5000:5000 --pull always gcr.io/light-maker-450401-b0/bookclub-backend-service-img